<!DOCTYPE html>
<html>
<head>
  <title>Diet Prediction Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center text-green-700">Enter Your Details</h2>

    <form action="/predict" method="POST">
      <label>Age:</label>
      <input type="number" name="age" required class="w-full border p-2 rounded mb-3">

      <label>Weight (kg):</label>
      <input type="number" step="0.1" name="weight" required class="w-full border p-2 rounded mb-3">

      <label>Height (cm):</label>
      <input type="number" step="0.1" name="height" required class="w-full border p-2 rounded mb-3">

      <label>Activity Level:</label>
      <select name="activity" required class="w-full border p-2 rounded mb-3">
        <option value="low">Low</option>
        <option value="moderate">Moderate</option>
        <option value="high">High</option>
      </select>

      <label>Goal:</label>
      <select name="goal" required class="w-full border p-2 rounded mb-3">
        <option value="loss">Weight Loss</option>
        <option value="gain">Weight Gain</option>
        <option value="maintain">Maintain</option>
      </select>

      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
        Get My Diet →
      </button>
    </form>
  </div>
</body>
</html>
